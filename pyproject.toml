[project]
name = "fde-card-disputes-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = "==3.12.13"
dependencies = [
    "pydantic==2.14.1",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov=tools",
    "--cov=evals",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["src", "tools", "evals"]
# The supplied package's own tools are kept as delivered, so only our scored run is gated.
omit = [
    "*/tools/evaluate.py",
    "*/tools/runtime.py",
    "*/tools/validate_package.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

# CI lints src, tools and evals. The supplied package's own tools are kept as delivered,
# so they are left out here as they are from coverage.
[tool.mypy]
# tools has no __init__.py, so its files are named from the repository root.
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tools.evaluate", "tools.runtime", "tools.validate_package"]
ignore_errors = true

[tool.ruff]
extend-exclude = ["tools/evaluate.py", "tools/runtime.py", "tools/validate_package.py"]

[tool.bandit]
# Leading * so the patterns match on any operating system.
exclude_dirs = ["*tools/evaluate.py", "*tools/runtime.py", "*tools/validate_package.py"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
