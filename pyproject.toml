[project]
name = "fde-card-disputes-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = "==3.12.13"
dependencies = [
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
