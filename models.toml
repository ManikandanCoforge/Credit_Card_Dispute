# Qualified model and provider pairs for the hybrid's two closed questions (ADR-003).
# src/model_clients.py refuses a live pair without a passed entry for the current schema hash
# (src/model_cue.py SCHEMA_HASH), or whose approved_by is empty: a live call sends customers'
# redacted lines to the provider, so each pair is approved first. A replay needs only the
# passed entry. tools/qualify_model.py --register appends entries here; review every change to
# this file in a pull request.
#
# The entry below was made by the Card Disputes Copilot assessment with prompt cue-v2, whose
# prompts and schemas src/model_cue.py copies verbatim (same schema hash). Its per-case
# results are in evals/qualification/reports/. approved_by records the team's capstone approval
# of this pair, so the hybrid is on by default (src/model_clients.py model_or_rules). Lumen Bank
# is fictional: a real bank would record its own sign-off here, after rerunning
# tools/qualify_model.py with this repository's client (ADR-003).

