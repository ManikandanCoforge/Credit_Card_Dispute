<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1100" viewBox="0 0 3200 1100" role="img" aria-labelledby="t d">
<title id="t">Pipeline: four stages from a bank case list to one approved record</title>
<desc id="d">Intake reads GET /v1/cases and validates the body with pydantic. Read turns bytes into typed bodies, retries a 503 and raises BankReadError only after the ladder is exhausted. Assemble builds one contract with six to nine exact-slice citations and raises ContractError when a source cannot support a claim. The human gate binds a sha256 draft hash to an approval and refuses a changed draft with 403 and a duplicate record with 409. All twelve dev cases build a contract.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D6F6A"/></marker></defs>
<rect x="0.0" y="0.0" width="3200.0" height="1100.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1.0"/>
<text x="130.0" y="66.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#68777D" text-anchor="start" font-weight="700" letter-spacing="2.6">LUMEN BANK · DISPUTE COPILOT</text>
<text x="130.0" y="96.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="2.2">DECK ASSET · PIPELINE</text>
<text x="3070.0" y="66.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#68777D" text-anchor="end" font-weight="700" letter-spacing="2.2">MAIN 8553BB3 · 28 OCT 2026</text>
<text x="3070.0" y="96.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="end" font-weight="400" letter-spacing="2.2">12 / 12 DEV CASES</text>
<path d="M130.0 132.0 L3070.0 132.0" fill="none" stroke="#D3CDC0" stroke-width="1.4"/>
<text x="130.0" y="196.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#0D6F6A" text-anchor="start" font-weight="700" letter-spacing="3.2">THE RUN, IN FOUR STAGES</text>
<text x="130.0" y="258.0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="54" fill="#12262E" text-anchor="start" font-weight="400">A case list becomes one record.</text>
<text x="130.0" y="308.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="29" fill="#2B454F" text-anchor="start" font-weight="400">A failed read is retried. A missing quote still stops the build.</text>
<text x="162.0" y="372.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="21" fill="#0D6F6A" text-anchor="start" font-weight="700" letter-spacing="3.0">01 · INTAKE</text>
<text x="912.0" y="372.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="21" fill="#0D6F6A" text-anchor="start" font-weight="700" letter-spacing="3.0">02 · READ</text>
<text x="1662.0" y="372.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="21" fill="#0D6F6A" text-anchor="start" font-weight="700" letter-spacing="3.0">03 · ASSEMBLE</text>
<text x="2412.0" y="372.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="21" fill="#0D6F6A" text-anchor="start" font-weight="700" letter-spacing="3.0">04 · HUMAN GATE</text>
<path d="M130.0 396.0 L3070.0 396.0" fill="none" stroke="#0D6F6A" stroke-width="1.5"/>
<path d="M162.0 390.0 L162.0 404.0" fill="none" stroke="#0D6F6A" stroke-width="2.5"/>
<path d="M912.0 390.0 L912.0 404.0" fill="none" stroke="#0D6F6A" stroke-width="2.5"/>
<path d="M1662.0 390.0 L1662.0 404.0" fill="none" stroke="#0D6F6A" stroke-width="2.5"/>
<path d="M2412.0 390.0 L2412.0 404.0" fill="none" stroke="#0D6F6A" stroke-width="2.5"/>
<path d="M130.0 432.0 L130.0 810.0" fill="none" stroke="#0D6F6A" stroke-width="3.2"/>
<text x="162.0" y="474.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="2.4">BANK CALL</text>
<text x="162.0" y="528.0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="44" fill="#12262E" text-anchor="start" font-weight="400">Read the bank</text>
<text x="162.0" y="580.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">GET /v1/cases: 12 cases.</text>
<text x="162.0" y="620.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">The body is validated, never guessed.</text>
<text x="162.0" y="660.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">pydantic validates the body.</text>
<path d="M162.0 712.0 L798.0 712.0" fill="none" stroke="#E2DDD2" stroke-width="1.0"/>
<text x="162.0" y="750.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">GET /v1/cases</text>
<text x="162.0" y="781.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">CaseListResponse.cases[]</text>
<path d="M880.0 432.0 L880.0 810.0" fill="none" stroke="#0D6F6A" stroke-width="3.2"/>
<text x="912.0" y="474.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="2.4">TYPED READ AND RETRIED</text>
<text x="912.0" y="528.0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="44" fill="#12262E" text-anchor="start" font-weight="400">Bytes to typed bodies</text>
<text x="912.0" y="580.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">200 returns bytes; all else stops.</text>
<text x="912.0" y="620.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">read_body raises BankReadError.</text>
<text x="912.0" y="660.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">A 503 is retried, never read as empty.</text>
<path d="M912.0 712.0 L1548.0 712.0" fill="none" stroke="#E2DDD2" stroke-width="1.0"/>
<text x="912.0" y="750.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">read_body(base_url, path)</text>
<text x="912.0" y="781.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">BankReadError</text>
<path d="M1630.0 432.0 L1630.0 810.0" fill="none" stroke="#0D6F6A" stroke-width="3.2"/>
<text x="1662.0" y="474.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="2.4">PURE FUNCTION</text>
<text x="1662.0" y="528.0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="44" fill="#12262E" text-anchor="start" font-weight="400">Text to a contract</text>
<text x="1662.0" y="580.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">Code assigns class and route.</text>
<text x="1662.0" y="620.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">Each citation is an exact slice.</text>
<text x="1662.0" y="660.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">A missing quote raises ContractError.</text>
<path d="M1662.0 712.0 L2298.0 712.0" fill="none" stroke="#E2DDD2" stroke-width="1.0"/>
<text x="1662.0" y="750.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">assemble_contract(record, ...)</text>
<text x="1662.0" y="781.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">Contract · 10 keys</text>
<path d="M2380.0 432.0 L2380.0 810.0" fill="none" stroke="#0D6F6A" stroke-width="3.2"/>
<text x="2412.0" y="474.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="17" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="2.4">SERVER GATE</text>
<text x="2412.0" y="528.0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="44" fill="#12262E" text-anchor="start" font-weight="400">Hash, human, record</text>
<text x="2412.0" y="580.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">sha256 binds the draft to review.</text>
<text x="2412.0" y="620.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">A changed draft is refused: 403.</text>
<text x="2412.0" y="660.0" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" fill="#2B454F" text-anchor="start" font-weight="400">Second record: 409 duplicate_case.</text>
<path d="M2412.0 712.0 L3048.0 712.0" fill="none" stroke="#E2DDD2" stroke-width="1.0"/>
<text x="2412.0" y="750.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">POST /v1/reviews 201</text>
<text x="2412.0" y="781.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="22" fill="#68777D" text-anchor="start" font-weight="400">403 approval_missing_or_draft_changed</text>
<path d="M130.0 850.0 L3070.0 850.0" fill="none" stroke="#E2DDD2" stroke-width="1.0"/>
<text x="130.0" y="892.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#68777D" text-anchor="start" font-weight="700" letter-spacing="2.4">OUTCOMES, NOT STOPS</text>
<text x="130.0" y="936.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="26" fill="#0D6F6A" text-anchor="start" font-weight="700">RETRIED · D07, D10</text>
<text x="1150.0" y="936.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="26" fill="#A96900" text-anchor="start" font-weight="700">MANUAL REVIEW · D05, D06, D07</text>
<text x="2350.0" y="936.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="26" fill="#1C7A58" text-anchor="start" font-weight="700">DUPLICATE PREVENTED · D09</text>
<path d="M130.0 970.0 L3070.0 970.0" fill="none" stroke="#D3CDC0" stroke-width="1.2"/>
<text x="130.0" y="1009.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="23" fill="#12262E" text-anchor="start" font-weight="700" letter-spacing="1.2">12 OF 12 DEV CASES BUILD A CONTRACT · 0 STOPS</text>
<text x="3070.0" y="1009.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="23" fill="#12262E" text-anchor="end" font-weight="700" letter-spacing="1.2">12 CASES · 27 TOOL ATTEMPTS · 3 RETRIES · 0 MODEL CALLS</text>
