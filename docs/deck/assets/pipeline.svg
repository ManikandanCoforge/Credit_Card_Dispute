<text x="1300.0" y="1042.0" font-family="'Cascadia Mono', 'Cascadia Code', Consolas, monospace" font-size="19" fill="#68777D" text-anchor="start" font-weight="400" letter-spacing="1.0">OPERATOR GATE: PYTHON -M SRC.REVIEW_RUNNER</text>
