name: checks

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12.13"
          save-cache: false
      - run: uv sync --locked
      - run: uv run --locked mypy src tools
      - run: uv run --locked ruff check src tools

  bandit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12.13"
          save-cache: false
      - run: uv sync --locked
      - run: uv run --locked bandit -c pyproject.toml -r src tools

  pytest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12.13"
          save-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=src --cov-report=term-missing --cov-fail-under=100

  env-files:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject committed env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.venv/' || true)
          if [ -n "$tracked" ]; then
            echo "Committed env files:"
            printf '%s\n' "$tracked"
            exit 1
          fi
